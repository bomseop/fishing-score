name: apk

# 태그를 밀면 서명된 APK 가 Releases 에 올라간다. 지인은 링크만 받으면 된다.
#
# 로컬에 Android SDK 를 깔 필요가 없다. ubuntu 러너에 SDK·JDK·Node 가 이미 있고
# android/ 는 여기서 `cap add` 로 매번 새로 만들어 patch-android.mjs 로 손본다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Capacitor 7 은 JDK 21 을 쓴다. 17 로는 AGP 가 뜨지 않는다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 의존성 설치
        # package-lock.json 을 커밋했다면 `npm ci` 로 바꾸는 편이 재현성이 좋다.
        run: npm install --no-audit --no-fund

      - name: 폰트 번들
        run: node scripts/bundle-fonts.mjs

      - name: 안드로이드 플랫폼 생성
        run: npx cap add android

      - name: 웹 자산 동기화
        run: npx cap sync android

      - name: 아이콘 · 스플래시 생성
        # 실패해도 Capacitor 기본 아이콘으로 빌드는 끝까지 간다
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Pages 주소 · 버전 주입
        env:
          OVERRIDE: ${{ vars.PAGES_URL }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$OVERRIDE" ]; then
            PAGES_URL="$OVERRIDE"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            PAGES_URL="https://$OWNER.github.io"
          else
            PAGES_URL="https://$OWNER.github.io/$REPO"
          fi
          # 태그 실행이면 태그를, 수동 실행이면 package.json 버전을 쓴다.
          # (수동 실행의 GITHUB_REF_NAME 은 브랜치명이라 버전이 될 수 없다)
          case "$GITHUB_REF" in
            refs/tags/*) APP_VERSION="${GITHUB_REF_NAME#v}" ;;
            *)           APP_VERSION=$(node -p "require('./package.json').version") ;;
          esac
          echo "PAGES_URL=$PAGES_URL  APP_VERSION=$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          PAGES_URL="$PAGES_URL" \
          REPO_SLUG="$GITHUB_REPOSITORY" \
          APP_VERSION="$APP_VERSION" \
            node scripts/inject-config.mjs

      - name: 안드로이드 프로젝트 패치
        env:
          # versionCode 는 단조 증가해야 덮어 설치가 된다. 실행 번호를 그대로 쓴다.
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # versionName 을 태그와 맞춘다 (patch-android 는 package.json 을 읽는다)
          node -e "const f='package.json',j=require('./'+f);j.version=process.env.APP_VERSION;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node scripts/patch-android.mjs

      - name: 서명 여부 판별
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          # 셸 스크립트 본문에 시크릿을 직접 끼워 넣지 않는다.
          # 비밀번호에 따옴표가 있으면 스크립트가 깨지고, 그 형태로 로그에 샐 수 있다.
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -u
          KS=android/app/release.keystore

          if [ -z "${KEYSTORE_B64:-}" ]; then
            # 키스토어가 아직 없어도 첫 스모크 테스트는 되게 한다.
            # 다만 디버그 서명은 빌드마다 달라져 기존 설치본을 덮어쓰지 못한다.
            echo "::warning::KEYSTORE_B64 시크릿이 없어 디버그 APK 로 빌드합니다. 업데이트 설치가 불가능합니다."
            echo "mode=debug" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 붙여넣는 과정에서 공백·개행·CR 이 섞이는 일이 잦다.
          # GNU base64 는 공백 한 칸에도 'invalid input' 으로 죽으므로 미리 턴다.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          echo "b64 길이: ${#CLEAN} (원본 ${#KEYSTORE_B64})"

          if ! printf '%s' "$CLEAN" | base64 -d > "$KS" 2>/tmp/b64err; then
            echo "::error::KEYSTORE_B64 디코딩 실패: $(cat /tmp/b64err)"
            echo "  시크릿 값이 잘렸거나 base64 가 아닌 문자가 섞였습니다."
            echo "  scripts/make-keystore.ps1 이 만든 .b64 파일 내용 '전체'를 다시 붙여넣으세요."
            exit 1
          fi

          # 잘린 값이 통과해서 Gradle 이 알아듣기 힘든 오류를 내는 걸 막는다.
          SZ=$(wc -c < "$KS")
          MAGIC=$(head -c 2 "$KS" | od -An -tx1 | tr -d ' \n')
          echo "복원된 키스토어: ${SZ} bytes, 헤더 ${MAGIC}"
          if [ "$SZ" -lt 500 ] || [ "$MAGIC" != "3082" ]; then
            echo "::error::복원된 파일이 키스토어가 아닙니다 (${SZ} bytes, 헤더 ${MAGIC}, 3082 여야 함)."
            exit 1
          fi

          MISSING=""
          [ -n "${KS_PASS:-}" ]    || MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -n "${KS_ALIAS:-}" ]   || MISSING="$MISSING KEY_ALIAS"
          [ -n "${KS_KEYPASS:-}" ] || MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::비어 있는 시크릿:$MISSING"
            exit 1
          fi

          echo "mode=release" >> $GITHUB_OUTPUT

      - name: 빌드
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 매니페스트 확인
        # 권한 문제는 '무엇이 실제로 선언됐는가'를 봐야 끝난다.
        # 소스가 아니라 AGP 가 병합한 최종 결과를 찍는다. 플러그인이 넣은 것까지 여기 다 있다.
        if: always()
        run: |
          echo "### 매니페스트 권한" >> $GITHUB_STEP_SUMMARY
          SRC=android/app/src/main/AndroidManifest.xml
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**앱 소스 (patch-android 적용 후)**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -o 'android:name="android.permission[^"]*"[^/]*' "$SRC" >> $GITHUB_STEP_SUMMARY || echo "(없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' 2>/dev/null | head -1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**병합 결과 (APK 에 실제로 들어간 것)**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "$MERGED" ]; then
            grep -o 'android.permission\.[A-Z_]*' "$MERGED" | sort -u >> $GITHUB_STEP_SUMMARY
          else
            echo "(병합 매니페스트를 찾지 못함)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY | tail -30

      - name: 산출물 정리
        id: out
        run: |
          mkdir -p dist
          MODE="${{ steps.sign.outputs.mode }}"
          SRC=$(find "android/app/build/outputs/apk/$MODE" -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "APK 를 찾지 못했습니다"; exit 1; fi
          NAME="walking-condition-${APP_VERSION}-${MODE}.apk"
          cp "$SRC" "dist/$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          {
            echo "### APK"
            echo "- 파일 \`$NAME\`"
            echo "- 서명 **${{ steps.sign.outputs.mode }}**"
            echo "- 크기 $(du -h "dist/$NAME" | cut -f1)"
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.out.outputs.name }}
          path: dist/*.apk
          retention-days: 30

      - name: 릴리스 업로드
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## 설치

            1. 아래 APK 를 안드로이드 폰에서 내려받는다
            2. "이 출처의 앱 설치 허용" 요청이 뜨면 허용 (브라우저별 최초 1회)
            3. 설치 → Play Protect 경고가 떠도 그대로 설치

            Play 스토어에 등록하지 않은 앱이라 경고가 뜨는 게 정상이다.

            **업데이트는 자동이 아니다.** 새 APK 를 받아 덮어 설치한다.
            앱 상단 툴바에 새 버전이 있으면 표시된다.

            구명조끼 착용은 갯바위·방파제에서 법적 의무다.
            금어기·출입통제구역은 출조 전 별도로 확인할 것.
